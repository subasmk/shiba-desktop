<!doctype html><html><head><meta charset="utf-8"><title>Relay pointer</title><style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
.ring{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border:3px solid #ff5a3c;border-radius:50%;opacity:0;animation:pulse .8s ease-out infinite}
.ring.r2{animation-delay:.4s}
.dot{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:#ff5a3c;border-radius:50%;box-shadow:0 0 10px rgba(255,90,60,.95)}
@keyframes pulse{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
</style></head><body><div class="ring"></div><div class="ring r2"></div><div class="dot"></div></body></html>
