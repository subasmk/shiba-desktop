name: Windows preview build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node --test behavior.test.cjs
      - name: Windows real-input behavior regression
        run: node behavior-runtime.cjs
      - name: Windows Electron smoke check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/downloads | Out-Null
          $source = Get-Content electron-test.cjs -Raw
          $source = $source.Replace('/downloads/', 'C:/downloads/')
          Set-Content windows-smoke.cjs $source
          node windows-smoke.cjs
      - run: npm version 0.1.1 --no-git-tag-version
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish separate private behavior prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1-behavior 'dist/Shiba Desktop 0.1.1.exe' 'test-evidence/*.png' 'test-evidence/behavior-runtime.json' 'C:/downloads/windows-region.json' 'C:/downloads/windows-desktop-collapsed.png' --target '${{ github.sha }}' --prerelease --title 'Shiba 0.1.1 - behavior fixes' --notes 'Fix stable idle, varied autonomous actions, intentional drag threshold and head/body/paw hit reactions. Windows native input and continuous runtime regression included. Unsigned portable. Expanded app-launch, personality and voice-call work remains separate.'
          Get-FileHash 'dist/Shiba Desktop 0.1.1.exe' -Algorithm SHA256 | Format-List
