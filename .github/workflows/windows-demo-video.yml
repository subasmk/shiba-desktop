name: Windows demo video (source runtime)
on:
  workflow_dispatch:
    inputs:
      tanglish:
        description: 'Include Tanglish voice segment (1/0)'
        default: '1'
permissions:
  contents: read
jobs:
  demo:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Download real voice models (whisper-tiny + kokoro-int8)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:/shiba-voice-lab | Out-Null
          curl.exe -sL -o D:/whisper.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-tiny.tar.bz2
          curl.exe -sL -o D:/kokoro.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
          tar -xf D:/whisper.tar.bz2 -C D:/shiba-voice-lab
          tar -xf D:/kokoro.tar.bz2 -C D:/shiba-voice-lab
      - name: Install Ollama and pull qwen3:0.6b brain
        shell: pwsh
        run: |
          choco install ollama -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          Start-Process -FilePath ollama -ArgumentList 'serve' -WindowStyle Hidden
          $t=0; while($t -lt 90){ try { $r = Invoke-RestMethod -Uri http://127.0.0.1:11434/api/tags -TimeoutSec 3; break } catch { Start-Sleep 3; $t+=3 } }
          ollama pull qwen3:0.6b
      - name: Pre-warm Ollama brain (model load + latency check)
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          $t=Measure-Command { ollama run qwen3:0.6b "Say hello in one short sentence." }
          Write-Host "ollama first-run seconds: $($t.TotalSeconds)"
      - name: Generate demo mic fixture (shorter gaps for watchable footage)
        run: node tools/gen-gapped-fixture.cjs --gaps 120,120,60 --out mic-fixture-demo.wav
      - name: Run demo capture (source runtime, real voice chain)
        run: node vi-demo.cjs
        env:
          SHIBA_MODELS: D:/shiba-voice-lab
          DEMO_TANGLISH: ${{ inputs.tanglish }}
      - name: Encode demo video from captured frames
        if: always()
        shell: pwsh
        run: |
          ffmpeg -y -framerate 4 -i frames/pet/%04d.png -framerate 4 -i frames/panel/%04d.png -filter_complex "[0:v]scale=320:480:force_original_aspect_ratio=decrease,pad=320:480:(ow-iw)/2:(oh-ih)/2:black[pet];[1:v]scale=640:480:force_original_aspect_ratio=decrease,pad=640:480:(ow-iw)/2:(oh-ih)/2:black[pan];[pet][pan]hstack=inputs=2,format=yuv420p" -c:v libx264 -movflags +faststart demo.mp4
          Get-Item demo.mp4 | Select-Object Length
      - name: Upload demo video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-demo-video
          path: |
            demo.mp4
            demo-manifest.json
            voice-timing.log
          if-no-files-found: warn
