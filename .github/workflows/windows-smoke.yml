name: Windows smoke validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - name: Unit tests (model-independent)
        # voice-backend.test.cjs forks the real voice worker and needs the
        # downloaded voice models at SHIBA_MODELS; it is validated where models
        # exist (Linux suite 19/19, user laptop final test). CI covers the rest.
        run: node --test core.test.cjs apps.test.cjs pet-history.test.cjs voice-session.test.cjs routines.test.cjs
      - name: Windows app launch + deterministic grounding smoke
        run: node vi-ground.cjs
      - name: Windows routines drawer smoke
        run: node vi-routines.cjs
      - name: Windows art/animation smoke
        run: node vi-art-regression.cjs
      - name: Collect screenshots into workspace
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke-shots | Out-Null
          Copy-Item D:/tmp/pet-*.png,D:/tmp/shiba-*.png smoke-shots/ -ErrorAction SilentlyContinue
          Copy-Item C:/tmp/pet-*.png,C:/tmp/shiba-*.png smoke-shots/ -ErrorAction SilentlyContinue
          Get-ChildItem smoke-shots
      - name: Upload Windows screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-screenshots
          path: smoke-shots/*.png
          if-no-files-found: warn
