name: Windows quit-path probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Probe watch (no quit, 30s health pings)
        run: node vi-quit-probe.cjs
        env:
          PROBE_VARIANT: watch
      - name: Probe early quit (600ms)
        run: node vi-quit-probe.cjs
        env:
          PROBE_VARIANT: early
      - name: Probe late quit (8s)
        run: node vi-quit-probe.cjs
        env:
          PROBE_VARIANT: late
