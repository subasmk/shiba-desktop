name: Windows packaged full-chain validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaged:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Download real voice models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:/shiba-voice-lab | Out-Null
          curl.exe -sL -o D:/whisper.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-tiny.tar.bz2
          curl.exe -sL -o D:/kokoro.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
          tar -xf D:/whisper.tar.bz2 -C D:/shiba-voice-lab
          tar -xf D:/kokoro.tar.bz2 -C D:/shiba-voice-lab
      - name: Install Ollama and pull qwen3:0.6b brain
        shell: pwsh
        run: |
          choco install ollama -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          Start-Process -FilePath ollama -ArgumentList 'serve' -WindowStyle Hidden
          $t=0; while($t -lt 90){ try { $r = Invoke-RestMethod -Uri http://127.0.0.1:11434/api/tags -TimeoutSec 3; break } catch { Start-Sleep 3; $t+=3 } }
          ollama pull qwen3:0.6b
      - name: Pre-warm Ollama brain (model load + latency check)
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          $t=Measure-Command { ollama run qwen3:0.6b "Say hello in one short sentence." }
          Write-Host "ollama first-run seconds: $($t.TotalSeconds)"
      - name: Build Windows package (portable + unpacked)
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Portable wrapper launch test (actual portable exe)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          Write-Host "Launching portable: $($exe.FullName) ($([math]::Round($exe.Length/1MB)) MB)"
          Remove-Item "$env:APPDATA/shiba-desktop/startup.log","$env:APPDATA/shiba-desktop/startup-prev.log" -ErrorAction SilentlyContinue
          Start-Process -FilePath $exe.FullName
          $ok=$false; $t=0
          while($t -lt 240){
            Start-Sleep 5; $t+=5
            $log="$env:APPDATA/shiba-desktop/startup.log"
            if(Test-Path $log){
              $c = Get-Content $log -Raw
              if($c -match 'panel-shown'){ $ok=$true; break }
            }
          }
          Write-Host "--- startup.log after ${t}s ---"
          Get-Content "$env:APPDATA/shiba-desktop/startup.log" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force pkg-shots | Out-Null
          Copy-Item "$env:APPDATA/shiba-desktop/startup*.log" pkg-shots/ -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          $b=[System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
          $g=[System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left,$b.Top,0,0,$bmp.Size)
          $bmp.Save("pkg-shots/portable-launch.png")
          Write-Host "screenshot saved; stopping Rex"
          Get-Process Rex -ErrorAction SilentlyContinue | Stop-Process -Force
          if(-not $ok){ Write-Error "PORTABLE LAUNCH FAILED: panel-shown milestone not reached in 240s"; exit 1 }
          Write-Host "PORTABLE-LAUNCH-PASS in ${t}s"
      - name: Generate gapped mic fixture (clean turn boundaries)
        run: node tools/gen-gapped-fixture.cjs
      - name: Prepare temp dirs
        shell: pwsh
        run: New-Item -ItemType Directory -Force D:/tmp | Out-Null
      - name: Packaged exe full voice chain with real brain
        run: node vi-packaged.cjs
        env:
          PACKAGED_EXE: ${{ github.workspace }}\dist\win-unpacked\Rex.exe
          SHIBA_MODELS: D:/shiba-voice-lab
      - name: Collect screenshots and timing into workspace
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg-shots | Out-Null
          Copy-Item D:/tmp/shiba-packaged-voice.png pkg-shots/ -ErrorAction SilentlyContinue
          Copy-Item C:/tmp/shiba-packaged-voice.png pkg-shots/ -ErrorAction SilentlyContinue
          Copy-Item ./voice-timing.log pkg-shots/ -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA/shiba-desktop/startup*.log" pkg-shots/ -ErrorAction SilentlyContinue
          Get-ChildItem pkg-shots
      - name: Upload packaged-run screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-packaged-screenshots
          path: pkg-shots/*
          if-no-files-found: warn
      - name: Upload portable exe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rex-windows-portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
