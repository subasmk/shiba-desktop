<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rex notch</title><style>
*{box-sizing:border-box;margin:0}html,body{height:100%;background:transparent;overflow:hidden;font:13px/1.45 system-ui,sans-serif;color:#f2eee5;-webkit-user-select:none;user-select:none}
#stage{display:flex;flex-direction:column;align-items:center;padding-top:0}
#sliver{display:none;width:190px;height:5px;border-radius:0 0 6px 6px;background:#101014;box-shadow:0 1px 6px rgba(0,0,0,.5)}
body[data-state="sliver"] #sliver{display:block}
body[data-state="sliver"] #bar,body[data-state="sliver"] #panel,body[data-state="hidden"] #bar,body[data-state="hidden"] #panel,body[data-state="hidden"] #sliver{display:none}
#bar{display:flex;align-items:center;gap:10px;max-width:572px;padding:7px 12px;border-radius:0 0 18px 18px;background:linear-gradient(180deg,#1d1d24,#101014);border:1px solid #2c2c35;border-top:0;box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);cursor:pointer}
#cat{width:46px;height:32px;object-fit:contain;flex:none;cursor:grab}
#cat.out{opacity:.4;filter:grayscale(.6)}
#who{display:none;flex-direction:column;min-width:86px}
#name{font-weight:700;font-size:13.5px;letter-spacing:.02em}
#status{color:#9a97a3;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
#deck{display:none;align-items:center;gap:6px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:0;min-width:44px;padding:5px 6px 4px;border:0;border-radius:12px;background:linear-gradient(180deg,#26262e,#17171d);color:#f2eee5;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.dbtn:hover{filter:brightness(1.3)}
.dbtn .ic{font-size:15px;line-height:1.15}
.dbtn .lb{font-size:9.5px;color:#9a97a3}
#glance{display:none;color:#8fd6a8;font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
#dot{width:8px;height:8px;border-radius:50%;background:#55555f;flex:none}
#dot.on{background:#3ddc84;box-shadow:0 0 7px rgba(61,220,132,.9)}
#expand,#dock{flex:none;border:0;border-radius:10px;padding:4px 8px;background:#26262e;color:#f2eee5;cursor:pointer}
#dock{background:#d94f2b;font-weight:600}
#expand{display:none}
.hidden{display:none!important}
body[data-state="hover"] #who,body[data-state="open"] #who,body[data-state="hover"] #deck,body[data-state="open"] #deck,body[data-state="hover"] #glance,body[data-state="open"] #glance,body[data-state="hover"] #expand,body[data-state="open"] #expand{display:flex}
body[data-state="hover"] #who,body[data-state="open"] #who{display:flex}
#panel{display:none;width:560px;margin-top:8px;padding:12px 14px;border-radius:16px;background:linear-gradient(180deg,#191920,#101014);border:1px solid #2c2c35;box-shadow:0 14px 34px rgba(0,0,0,.55)}
body[data-state="open"] #panel{display:block}
.p-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12.5px;margin-bottom:8px}
.p-head button{border:0;border-radius:8px;background:#26262e;color:#f2eee5;padding:3px 9px;cursor:pointer}
.p-sub{color:#9a97a3;font-size:11px;margin:10px 0 6px}
#tiles,#palette{display:flex;flex-wrap:wrap;gap:6px}
.tile{display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:11px;background:#1d1d24;border:1px solid #2c2c35;font-size:11.5px}
.tile .ic{font-size:14px}
.tile button{border:0;border-radius:7px;background:#26262e;color:#f2eee5;padding:1px 6px;cursor:pointer;font-size:11px}
.tile button:hover{background:#d94f2b}
.tile.add{border-style:dashed;cursor:pointer;color:#9a97a3}
.tile.add:hover{color:#f2eee5;border-color:#d94f2b}
#chat-reply{color:#c9c9d2;font-size:12px;min-height:16px;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat-row{display:flex;gap:8px;margin-top:6px}
#chat-input{flex:1;background:#1a1a20;border:1px solid #2c2c35;border-radius:11px;color:#f2eee5;padding:8px 11px;font:inherit;-webkit-user-select:text;user-select:text}
#chat-input:focus{outline:2px solid #d94f2b;outline-offset:0}
#chat-send{border:0;border-radius:11px;background:#d94f2b;color:#fff;font-weight:700;padding:8px 16px;cursor:pointer}
#chat-send:disabled{opacity:.5}
</style></head><body data-state="collapsed"><div id="stage">
<div id="sliver" data-hit></div>
<div id="bar" data-hit>
<img id="cat" src="cat-head.png" draggable="false" alt="Rex - drag out onto the desktop" title="Drag me out onto the desktop">
<div id="who"><div id="name">Rex</div><div id="status">Idle</div></div>
<div id="deck"></div>
<div id="glance" title="CPU and memory right now"></div>
<span id="dot" title="Listening status"></span>
<button id="dock" class="hidden" title="Bring Rex back to the notch">Dock</button>
<button id="expand" title="Open the notch panel">▾</button>
</div>
<section id="panel" data-hit>
<div class="p-head"><span>Edit deck</span><button id="close-panel" title="Close panel">▴</button></div>
<div id="tiles"></div>
<div class="p-sub">Add to the deck</div>
<div id="palette"></div>
<div id="chat-reply"></div>
<div id="chat-row"><input id="chat-input" type="text" maxlength="5000" placeholder="Ask Rex anything…" aria-label="Chat with Rex"><button id="chat-send">Chat</button></div>
</section>
</div>
<script src="notch.cjs"></script>
<script src="notch.js"></script>
</body></html>
